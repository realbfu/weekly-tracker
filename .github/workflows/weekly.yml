name: weekly-tracker

on:
  schedule:
    # GitHub 的 schedule 觸發是 best-effort，不只會延遲，觀察到至少兩次整週完全沒觸發
    # （2026-10-10 那次疑似是改 cron 時間太接近原訂觸發時間，被 GitHub 直接跳過整輪）。
    # 因此排三個時段互為備援：只要其中一個有準時/準點觸發，資料就不會整週沒更新。
    # run_weekly.py 本身是冪等的（git diff 沒變化就不 commit），同一天跑多次沒有副作用。
    # 週六 06:10 台北時間（週五 22:10 UTC）：美股週五收盤約為台北週六 04:00–05:00
    - cron: "10 22 * * 5"
    # 備援一：週六 09:10 台北時間（週六 01:10 UTC）
    - cron: "10 1 * * 6"
    # 備援二：週六 13:10 台北時間（週六 05:10 UTC）
    - cron: "10 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # 失敗時（例如被限流）此步驟非 0 結束，後續不會 commit 與發佈，上次成功的頁面維持不變
      - run: python run_weekly.py

      # Pages 由 main 分支根目錄發佈，故把產生的頁面放到根目錄
      - name: 更新根目錄 index.html
        run: cp site/index.html index.html

      - name: 提交資料與頁面變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "資料無變更"
          else
            git commit -m "chore: 更新每週追蹤資料 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      # 以 GITHUB_TOKEN 推送不一定會觸發 Pages 建置，主動要求一次以確保上線
      - name: 觸發 Pages 建置
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
